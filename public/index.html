<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Groq Router v2</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2310b981'/><text x='50' y='68' font-size='52' text-anchor='middle' font-family='sans-serif' font-weight='bold' fill='%23020617'>W</text></svg>" />
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var dark = saved ? saved === 'dark' : true;
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 400: '#34d399', 500: '#10b981', 600: '#059669' } },
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.45); border-radius: 999px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .spinner { width: 22px; height: 22px; border: 2.5px solid rgba(16,185,129,0.2); border-top-color: #10b981; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fade-in 0.18s ease-out; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .scroll-thin { scrollbar-width: thin; }
    .qr-box img { image-rendering: pixelated; }
    input[type="checkbox"].toggle { appearance: none; width: 42px; height: 24px; border-radius: 999px; background: #334155; position: relative; cursor: pointer; transition: background 0.15s; flex: none; }
    input[type="checkbox"].toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
    input[type="checkbox"].toggle:checked { background: #10b981; }
    input[type="checkbox"].toggle:checked::after { transform: translateX(18px); }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">

  <aside class="fixed inset-y-0 left-0 z-40 hidden w-64 flex-col border-r border-slate-200 bg-white md:flex dark:border-slate-800 dark:bg-slate-900/60">
    <div class="flex items-center gap-3 px-5 py-5">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-500 text-lg font-extrabold text-slate-950">W</div>
      <div>
        <p class="text-sm font-bold leading-tight">WhatsApp Router</p>
        <p class="text-[11px] font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400">Groq · OpenRouter · v2</p>
      </div>
    </div>
    <nav id="sidebar-nav" class="flex-1 space-y-1 px-3 py-2"></nav>
    <div class="space-y-3 px-4 pb-5">
      <div class="flex items-center justify-between rounded-xl border border-slate-200 px-3 py-2 dark:border-slate-800">
        <span class="text-xs font-medium text-slate-500 dark:text-slate-400">Dark mode</span>
        <button data-theme-toggle class="rounded-lg border border-slate-300 px-2.5 py-1 text-xs font-semibold text-slate-600 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800" aria-label="Toggle theme">
          <span data-theme-label>On</span>
        </button>
      </div>
    </div>
  </aside>

  <div class="md:pl-64">
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80">
      <div class="flex items-center justify-between gap-3 px-4 py-3 sm:px-6">
        <div class="flex min-w-0 items-center gap-3">
          <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-emerald-500 text-sm font-extrabold text-slate-950 md:hidden">W</div>
          <div class="min-w-0">
            <h1 id="page-title" class="truncate text-base font-bold sm:text-lg">Dashboard</h1>
            <p id="page-subtitle" class="hidden truncate text-xs text-slate-500 sm:block dark:text-slate-400">WhatsApp agents, inbox and groups</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button data-theme-toggle class="rounded-lg border border-slate-300 p-2 text-slate-600 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800" aria-label="Toggle theme">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2m0 14v2M5.6 5.6l1.4 1.4m10 10l1.4 1.4M3 12h2m14 0h2M5.6 18.4l1.4-1.4m10-10l1.4-1.4"/><circle cx="12" cy="12" r="3.5"/></svg>
          </button>
        </div>
      </div>
      <div id="mobile-nav" class="flex gap-1 overflow-x-auto px-3 pb-2 md:hidden"></div>
      <div id="persistence-banner" class="hidden border-t border-amber-500/40 bg-amber-500/10 px-4 py-2.5 text-xs font-medium leading-relaxed text-amber-800 dark:text-amber-200 sm:px-6"></div>
    </header>

    <main class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 sm:py-8">
      <div id="view"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="pointer-events-none fixed bottom-4 right-4 z-[60] flex w-full max-w-sm flex-col gap-2 px-4 sm:px-0"></div>

  <script src="/app/core.js"></script>
  <script src="/app/pages-dashboard.js"></script>
  <script src="/app/pages-agents.js"></script>
  <script src="/app/pages-inbox.js"></script>
  <script src="/app/pages-more.js"></script>
  <script src="/app/boot.js"></script>
</body>
</html>
